<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Location Vélos Valberg</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .8;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    .bike {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    .available {
      color: #16a34a;
      font-weight: bold;
    }

    .rented {
      color: #dc2626;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

<header>
  <h1>🚲 Location Vélos Valberg</h1>
  <p>Gestion des locations</p>
</header>

<div class="container">

  <div class="card">
    <h2>➕ Nouvelle location</h2>

    <label>Nom du client</label>
    <input id="clientName" type="text" placeholder="Nom et prénom">

  
    <label>Téléphone</label>
    <input id="clientPhone" type="tel" placeholder="06 00 00 00 00">

    <label>Vélo</label>
    <select id="bikeSelect">
      <option value="">Chargement des vélos...</option>
    </select>

    <label>Durée</label>
    <select id="duration">
      <option value="0.5">1/2 journée</option>
      <option value="1">1 journée</option>
      <option value="2">2 jours</option>
      <option value="3">3 jours</option>
      <option value="7">1 semaine</option>
    </select>

    <button onclick="createRental()">
      Enregistrer la location
    </button>

    <div id="message"></div>
  </div>


  <div class="card">
    <h2>🚲 Vélos disponibles</h2>
    <div id="bikes">
      Chargement...
    </div>
  </div>


  <div class="card">
    <h2>📋 Informations</h2>
    <p>
      Application interne de gestion des locations de vélos.
    </p>
    <p>
      📍 Valberg
    </p>
  </div>

</div>


<script>

  /* ================================
     CONNEXION SUPABASE
     ================================ */

  const SUPABASE_URL =
    "https://uludkrippzehjvxbghth.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dcOILXwTw_qk7Fn-Quo0zQ_sBbW6eCb";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     MESSAGE
     ================================ */

  function showMessage(text, type) {

    const message = document.getElementById("message");

    message.innerText = text;
    message.className = type;
    message.style.display = "block";

    setTimeout(() => {
      message.style.display = "none";
    }, 4000);
  }


  /* ================================
     CHARGER LES VELOS
     ================================ */

  async function loadBikes() {

  const bikesContainer = document.getElementById("bikes");
  const select = document.getElementById("bikeSelect");

  bikesContainer.innerHTML = "<p>Chargement des vélos...</p>";
  select.innerHTML = '<option value="">Chargement des vélos...</option>';

  const { data, error } = await supabaseClient
    .from("bikes")
    .select("*")
    .order("id", { ascending: true });

  if (error) {

    console.error("Erreur bikes :", error);

    bikesContainer.innerHTML = `
      <p style="color:#dc2626;font-weight:bold;">
        ❌ Erreur de chargement des vélos
      </p>
      <p>${error.message}</p>
    `;

    select.innerHTML =
      '<option value="">Erreur de connexion</option>';

    return;
  }

  console.log("Vélos reçus :", data);

  if (!data || data.length === 0) {

    bikesContainer.innerHTML = `
      <p style="color:#666;">
        Aucun vélo n'est enregistré dans la base de données.
      </p>
    `;

    select.innerHTML =
      '<option value="">Aucun vélo disponible</option>';

    return;
  }

  bikesContainer.innerHTML = "";

  select.innerHTML =
    '<option value="">Choisir un vélo</option>';

  data.forEach(bike => {

    const name =
      bike.name ||
      bike.model ||
      bike.bike_type ||
      "Vélo " + bike.id;

    const available =
      bike.available !== false;

    const div = document.createElement("div");

    div.className = "bike";

    div.innerHTML = `
      <strong>🚲 ${name}</strong><br>
      <span class="${available ? "available" : "rented"}">
        ${available ? "● Disponible" : "● Loué"}
      </span>
    `;

    bikesContainer.appendChild(div);

    if (available) {

      const option = document.createElement("option");

      option.value = bike.id;
      option.textContent = name;

      select.appendChild(option);
    }

  });

}

  /* ================================
     CREER UNE LOCATION
     ================================ */

  async function createRental() {

    const clientName =
      document.getElementById("clientName").value.trim();

    const clientPhone =
      document.getElementById("clientPhone").value.trim();

    const bikeId =
      document.getElementById("bikeSelect").value;

    const duration =
      document.getElementById("duration").value;


    if (!clientName) {

      showMessage(
        "Veuillez entrer le nom du client.",
        "error"
      );

      return;
    }


    if (!bikeId) {

      showMessage(
        "Veuillez sélectionner un vélo.",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("rentals")
        .insert({

          client_name: clientName,

          client_phone: clientPhone,

          bike_id: bikeId,

          duration_days: Number(duration),

          status: "active"

        });


    if (error) {

      console.error(error);

      showMessage(
        "Erreur : " + error.message,
        "error"
      );

      return;
    }


    showMessage(
      "✅ Location enregistrée !",
      "success"
    );


    document.getElementById("clientName").value = "";
    document.getElementById("clientPhone").value = "";
    document.getElementById("bikeSelect").value = "";


    loadBikes();

  }


  /* ================================
     DEMARRAGE
     ================================ */

  loadBikes();

</script>

</body>
</html>
