<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Location Vélos Valberg</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .8;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    .bike {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      background: #fafafa;
    }

    .bike-name {
      font-size: 17px;
      font-weight: bold;
    }

    .bike-size {
      margin-top: 5px;
      color: #555;
    }

    .available {
      color: #16a34a;
      font-weight: bold;
      margin-top: 8px;
    }

    .rented {
      color: #dc2626;
      font-weight: bold;
      margin-top: 8px;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-weight: bold;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      color: #666;
    }

    .empty {
      color: #666;
      text-align: center;
      padding: 10px;
    }

  </style>

</head>


<body>


<header>

  <h1>🚲 Location Vélos Valberg</h1>

  <p>Gestion des locations</p>

</header>


<div class="container">


  <!-- =========================
       NOUVELLE LOCATION
       ========================= -->

  <div class="card">

    <h2>➕ Nouvelle location</h2>


    <label for="clientName">
      Nom du client
    </label>

    <input
      id="clientName"
      type="text"
      placeholder="Nom et prénom"
    >


    <label for="clientPhone">
      Téléphone
    </label>

    <input
      id="clientPhone"
      type="tel"
      placeholder="06 00 00 00 00"
    >


    <label for="bikeSelect">
      Vélo
    </label>

    <select id="bikeSelect">

      <option value="">
        Chargement des vélos...
      </option>

    </select>


    <label for="duration">
      Durée
    </label>

    <select id="duration">

      <option value="0.5">
        1/2 journée
      </option>

      <option value="1">
        1 journée
      </option>

      <option value="2">
        2 jours
      </option>

      <option value="3">
        3 jours
      </option>

      <option value="7">
        1 semaine
      </option>

    </select>


    <button onclick="createRental()">
      ✅ Enregistrer la location
    </button>


    <div id="message"></div>

  </div>



  <!-- =========================
       STOCK VELOS
       ========================= -->

  <div class="card">

    <h2>🚲 Stock des vélos</h2>

    <div id="bikes">

      <p class="loading">
        Chargement...
      </p>

    </div>

  </div>



  <!-- =========================
       INFORMATIONS
       ========================= -->

  <div class="card">

    <h2>📋 Informations</h2>

    <p>
      Application interne de gestion des locations de vélos.
    </p>

    <p>
      📍 Valberg
    </p>

  </div>


</div>



<script>


/* ==================================================
   CONNEXION SUPABASE
   ================================================== */

const SUPABASE_URL =
  "https://uludkrippzehjvxbghth.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dcOILXwTw_qk7Fn-Quo0zQ_sBbW6eCb"


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ==================================================
   MESSAGE
   ================================================== */

function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.innerText = text;

  message.className = type;

  message.style.display = "block";


  setTimeout(() => {

    message.style.display = "none";

  }, 4000);

}



/* ==================================================
   NOM DU VELO
   ================================================== */

function getBikeName(bike) {

  if (bike.categorie) {

    return bike.categorie;

  }

  if (bike.name) {

    return bike.name;

  }

  if (bike.model) {

    return bike.model;

  }

  return "Vélo " + bike.id;

}



/* ==================================================
   TAILLE DU VELO
   ================================================== */

function getBikeSize(bike) {

  if (bike.size) {

  return "Taille : " + bike.size;

}


  return "Taille non renseignée";

}



/* ==================================================
   CHARGER LES VELOS
   ================================================== */

async function loadBikes() {


  const bikesContainer =
    document.getElementById("bikes");


  const select =
    document.getElementById("bikeSelect");


  bikesContainer.innerHTML =
    '<p class="loading">Chargement des vélos...</p>';


  select.innerHTML =
    '<option value="">Chargement des vélos...</option>';



  const { data, error } =

    await supabaseClient

      .from("bikes")

      .select("*")

      .order("id", {
        ascending: true
      });



  /* =========================
     ERREUR
     ========================= */

  if (error) {


    console.error(
      "Erreur bikes :",
      error
    );


    bikesContainer.innerHTML = `

      <p class="error">

        ❌ Erreur de chargement

      </p>

      <p>

        ${error.message}

      </p>

    `;


    select.innerHTML =

      '<option value="">Erreur de connexion</option>';


    return;

  }



  console.log(
    "Vélos reçus :",
    data
  );



  /* =========================
     AUCUN VELO
     ========================= */

  if (!data || data.length === 0) {


    bikesContainer.innerHTML = `

      <p class="empty">

        Aucun vélo enregistré.

      </p>

    `;


    select.innerHTML =

      '<option value="">Aucun vélo</option>';


    return;

  }



  bikesContainer.innerHTML = "";


  select.innerHTML = `

    <option value="">

      Choisir un vélo

    </option>

  `;



  /* =========================
     AFFICHAGE
     ========================= */

  data.forEach(bike => {


    const name =
      getBikeName(bike);


    const size =
      getBikeSize(bike);


    /*
      IMPORTANT :
      La colonne utilisée dans
      ta base est "disponible".
    */

    const available =
      bike.disponible !== false;



    /* =========================
       CARTE VELO
       ========================= */

    const div =
      document.createElement("div");


    div.className =
      "bike";


    div.innerHTML = `

      <div class="bike-name">

        🚲 ${name}

      </div>

      <div class="bike-size">

        ${size}

      </div>

      <div class="${available ? "available" : "rented"}">

        ${available
          ? "● Disponible"
          : "● Loué"}

      </div>

    `;


    bikesContainer.appendChild(div);



    /* =========================
       LISTE RESERVATION
       ========================= */

    if (available) {


      const option =
        document.createElement("option");


      option.value =
        bike.id;


      option.textContent =
        name +
        (bike.taille
          ? " - " + bike.taille
          : "");


      select.appendChild(option);

    }

  });

}



/* ==================================================
   CREER UNE LOCATION
   ================================================== */

async function createRental() {


  const clientName =
    document
      .getElementById("clientName")
      .value
      .trim();


  const clientPhone =
    document
      .getElementById("clientPhone")
      .value
      .trim();


  const bikeId =
    document
      .getElementById("bikeSelect")
      .value;


  const duration =
    document
      .getElementById("duration")
      .value;



  /* =========================
     VERIFICATION CLIENT
     ========================= */

  if (!clientName) {


    showMessage(
      "Veuillez entrer le nom du client.",
      "error"
    );


    return;

  }



  /* =========================
     VERIFICATION VELO
     ========================= */

  if (!bikeId) {


    showMessage(
      "Veuillez sélectionner un vélo.",
      "error"
    );


    return;

  }



  /* =========================
     ENREGISTRER LOCATION
     ========================= */

  const { error } =

    await supabaseClient

      .from("rentals")

      .insert({

        client_name:
          clientName,

        client_phone:
          clientPhone,

        bike_id:
          bikeId,

        duration_days:
          Number(duration),

        status:
          "active"

      });



  /* =========================
     ERREUR LOCATION
     ========================= */

  if (error) {


    console.error(error);


    showMessage(
      "Erreur : " + error.message,
      "error"
    );


    return;

  }



  /* =========================
     PASSER LE VELO EN LOUE
     ========================= */

  const { error: bikeError } =

    await supabaseClient

      .from("bikes")

      .update({

        disponible: false

      })

      .eq("id", bikeId);



  if (bikeError) {


    console.error(
      "Erreur disponibilité :",
      bikeError
    );

  }



  /* =========================
     SUCCES
     ========================= */

  showMessage(
    "✅ Location enregistrée !",
    "success"
  );



  /* =========================
     VIDER FORMULAIRE
     ========================= */

  document
    .getElementById("clientName")
    .value = "";


  document
    .getElementById("clientPhone")
    .value = "";


  document
    .getElementById("bikeSelect")
    .value = "";



  /* =========================
     RECHARGER STOCK
     ========================= */

  loadBikes();

}



/* ==================================================
   DEMARRAGE APPLICATION
   ================================================== */

loadBikes();


</script>


</body>

</html>
